<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colecta de Sangre — IEEE UOH</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Share Tech Mono', monospace;
    background: #001a2e;
    color: #a0d4f5;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 720px;
    background: #001a2e;
    border: 2px solid #00629b;
    border-radius: 4px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,98,155,0.04) 3px, rgba(0,98,155,0.04) 4px);
    pointer-events: none;
    z-index: 0;
  }
  .wrap > * { position: relative; z-index: 1; }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #00629b;
    padding-bottom: 12px;
    margin-bottom: 14px;
    gap: 12px;
  }
  .logos {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logos img {
    height: 36px;
    width: auto;
    filter: brightness(0) invert(0.6) sepia(1) saturate(3) hue-rotate(180deg) brightness(1.2);
    opacity: 0.85;
  }
  .logo-sep {
    width: 1px;
    height: 28px;
    background: rgba(0,98,155,0.5);
  }
  .header-text { flex: 1; min-width: 0; }
  .title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    color: #00aaff;
    letter-spacing: 3px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .subtitle {
    font-size: 10px;
    color: #00629b;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .live-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #00629b;
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .blink { animation: blink 1s step-end infinite; color: #e24b4a; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    border: 1px solid #00629b;
    padding: 8px 12px;
    background: rgba(0,98,155,0.08);
  }
  .stat-val {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    color: #00aaff;
    line-height: 1;
  }
  .stat-lbl {
    font-size: 9px;
    color: #00629b;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* RANKING */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(0,98,155,0.2);
  }
  .row:last-child { border-bottom: none; }
  .pos {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    width: 30px;
    text-align: center;
    flex-shrink: 0;
    color: rgba(0,170,255,0.25);
  }
  .pos.p1 { color: #ffd700; }
  .pos.p2 { color: #c0c0c0; }
  .pos.p3 { color: #cd7f32; }
  .info { flex: 1; min-width: 0; }
  .name {
    font-size: 11px;
    color: #a0d4f5;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 5px;
  }
  .track {
    height: 4px;
    background: rgba(0,98,155,0.2);
    position: relative;
  }
  .fill {
    height: 100%;
    background: #00629b;
    transition: width 1.2s cubic-bezier(.4,0,.2,1);
    position: relative;
  }
  .fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0;
    width: 3px; height: 100%;
    background: #00aaff;
  }
  .fill.p1 { background: linear-gradient(90deg, #003f6b, #ffd700); }
  .fill.p1::after { background: #ffd700; }
  .fill.p2 { background: linear-gradient(90deg, #003f6b, #c0c0c0); }
  .fill.p2::after { background: #c0c0c0; }
  .fill.p3 { background: linear-gradient(90deg, #003f6b, #cd7f32); }
  .fill.p3::after { background: #cd7f32; }
  .count {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(16px, 4vw, 22px);
    color: #00aaff;
    flex-shrink: 0;
    min-width: 42px;
    text-align: right;
    line-height: 1;
  }
  .count small {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px;
    color: #00629b;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: normal;
  }

  /* FOOTER */
  .footer {
    margin-top: 12px;
    border-top: 1px solid rgba(0,98,155,0.3);
    padding-top: 8px;
    font-size: 9px;
    color: rgba(0,98,155,0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .spinner {
    display: inline-block;
    width: 8px; height: 8px;
    border: 1px solid rgba(0,170,255,0.3);
    border-top-color: #00aaff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logos">
      <!-- Logo UOH desde Wikimedia Commons -->
      <img src="logo-uoh.png" alt="Universidad de O'Higgins" style="height:36px; filter: brightness(0) invert(1); opacity:0.85;">
      <div class="logo-sep"></div>
      <!-- Logo IEEE texto SVG inline -->
      <svg width="52" height="36" viewBox="0 0 52 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="IEEE">
        <text x="0" y="16" font-family="Oswald, sans-serif" font-size="18" font-weight="700" fill="#00aaff" letter-spacing="2">IEEE</text>
      </svg>
    </div>
    <div class="header-text">
      <div class="title">Colecta de Sangre</div>
      <div class="subtitle">Rama Estudiantil UOH</div>
      <div class="live-row">
        <span class="blink">&#9632;</span>
        <span id="update-msg">Inicializando...</span>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="stat-total">—</div>
      <div class="stat-lbl">Total donaciones</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-activas">—</div>
      <div class="stat-lbl">Carreras activas</div>
    </div>
  </div>

  <div id="ranking"></div>

  <div class="footer">
    <span>SYS:BLOODDRIVE_V2.0 // IEEE-UOH</span>
    <span id="clock">--:--:--</span>
  </div>

</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNZHNDHJUIHDWD-SCeROvrqzIQ-81c7erTvMMuJEVzWNhsmogZj01ZOy1-BF2NSGLsYTYFTq0hA_gJ/pub?gid=0&single=true&output=csv';

const NAME_MAP = { 'ING. MMO': 'Ing. Mod. Matemático de Datos' };

const POS_CLASS = ['p1','p2','p3'];
const POS_LABEL = ['01','02','03'];

function fixName(n) {
  const up = n.toUpperCase().trim();
  return NAME_MAP[up] || n;
}

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  const start = isNaN(Number(lines[0].split(',')[1])) ? 1 : 0;
  return lines.slice(start).map(line => {
    const parts = line.split(',');
    return {
      carrera: fixName(parts[0].replace(/"/g,'').trim()),
      donaciones: parseInt(parts[1]) || 0
    };
  }).filter(d => d.carrera);
}

function renderRanking(data) {
  const sorted = [...data].sort((a,b) => b.donaciones - a.donaciones);
  const max = sorted[0]?.donaciones || 1;
  const total = sorted.reduce((s,d) => s + d.donaciones, 0);
  const activas = sorted.filter(d => d.donaciones > 0).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-activas').textContent = activas;

  const container = document.getElementById('ranking');
  container.innerHTML = '';

  sorted.forEach((d, i) => {
    const pct = d.donaciones > 0 ? Math.round((d.donaciones / max) * 100) : 0;
    const pc = i < 3 ? POS_CLASS[i] : '';
    const pl = i < 3 ? POS_LABEL[i] : String(i+1).padStart(2,'0');

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="pos ${pc}">${pl}</div>
      <div class="info">
        <div class="name">${d.carrera}</div>
        <div class="track">
          <div class="fill ${pc}" style="width:0%" data-pct="${pct}"></div>
        </div>
      </div>
      <div class="count">${d.donaciones}<small>unidades</small></div>`;
    container.appendChild(row);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('.fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  });
}

async function refresh() {
  const msg = document.getElementById('update-msg');
  msg.innerHTML = '<span class="spinner"></span>Cargando datos...';
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const data = parseCSV(text);
    if (!data.length) throw new Error('Sin datos');
    renderRanking(data);
    const now = new Date().toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
    msg.textContent = `Sync OK — ${now}`;
  } catch(e) {
    msg.textContent = 'Error al conectar — reintentando...';
    console.error(e);
  }
}

function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-CL');
}

refresh();
setInterval(refresh, 30000);
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
